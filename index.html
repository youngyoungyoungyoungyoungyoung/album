.tracks{display:grid;grid-template-columns:1fr;gap:0;margin-top:16px}

.tr{position:relative;overflow:hidden;display:flex;align-items:center;gap:9px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 4px;width:100%;text-align:left;border-radius:0;transition:background .1s}
.tr::before{content:none}.tr:hover{background:var(--paper);transform:none;box-shadow:none}.tr:active{transform:none}

.pill{min-width:40px;text-align:center;padding:2px 5px;border-radius:0;border:1px solid var(--line);font-weight:700;font-size:11px}
.pill.none{border-color:transparent;color:var(--soft)}
.tr.rated{--c:var(--accent)}.tr.best{--c:var(--mint)}.tr.worst{--c:var(--coral)}
.tr.rated .pill,.tr.best .pill,.tr.worst .pill{color:var(--c);border-color:color-mix(in srgb,var(--c) 60%,var(--line));background:transparent}
.tag{flex:none;font-size:8px;font-weight:700;letter-spacing:1px;color:var(--c)}
.wrap.wide{max-width:none}.vs{display:grid;grid-template-columns:1fr 1fr;gap:25px}.slot{min-width:0}
.vh{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 0 16px}

.vs .tracks{grid-template-columns:1fr;margin-top:10px;gap:0}.vs .tr{padding:8px 2px;gap:5px;font-size:11px}.vs .tr .n{width:17px;font-size:9px}.vs .pill{min-width:32px;padding:2px 3px;font-size:10px}

function matchScore(m,words){
  var q=norm(words.join(" ")),title=norm(m.title),artist=norm(m.artist),score=0;
  if(artist===q)score+=10000;
  else if(q&&artist.indexOf(q)>=0)score+=6000;
  if(title===q)score+=3000;
  else if(q&&title.indexOf(q)>=0)score+=1800;
  words.forEach(function(w){var n=norm(w);if(n&&title.indexOf(n)>=0)score+=45;if(n&&artist.indexOf(n)>=0)score+=60});
  return score;
}
async function searchResults(words){
  var settled=await Promise.allSettled([dzArtistAlbums(words),dzSearch(words),mbSearch(words)]),all=[],available=false;
  settled.forEach(function(result){if(result.status==="fulfilled"){all=all.concat(result.value);available=true}});
  if(!available)throw new Error("Search providers are unavailable");
  var dedup={};
  all.forEach(function(album){
    var key=norm(album.artist)+"|"+norm(album.title);
    var current=dedup[key];
    if(!current){dedup[key]=album;return}
    current.rank=Math.max(current.rank||0,album.rank||0);
    current.popularityRank=Math.max(current.popularityRank||0,album.popularityRank||0);
    current.trackPopularity=Math.max(current.trackPopularity||0,album.trackPopularity||0);
    current.trackSignals=Math.max(current.trackSignals||0,album.trackSignals||0);
    current.artistFans=Math.max(current.artistFans||0,album.artistFans||0);
    current.artistExact=current.artistExact||album.artistExact;
    if(!current.cover&&album.cover)current.cover=album.cover;
    if(!current.year&&album.year)current.year=album.year;
  });
  return Object.keys(dedup).map(function(key){return dedup[key]}).sort(function(a,b){
    if(!!a.artistExact!==!!b.artistExact)return a.artistExact?-1:1;
    if(a.artistExact&&b.artistExact){
      var trackPopularity=(b.trackPopularity||0)-(a.trackPopularity||0);
      if(trackPopularity)return trackPopularity;
      var discographyRank=(b.rank||0)-(a.rank||0);
      if(discographyRank)return discographyRank;
    }
    var relevance=matchScore(b,words)-matchScore(a,words);
    if(relevance)return relevance;
    var popularity=(b.popularityRank||b.rank||0)-(a.popularityRank||a.rank||0);
    if(popularity)return popularity;
    return(b.year||"").localeCompare(a.year||"");

  if(me!==seq)return;
  if(!list.length){box.innerHTML=why?'<div class="msg">Search failed ('+esc(why)+'). Please try again.</div>':'<div class="msg">No results found.</div>';return}
  var P="c"+(box.id||"x")+"_";
  box.innerHTML=list.map(function(m){
    found[m.id]=m;
    var meta=esc(m.artist)+(m.year?" · "+esc(m.year):"");
    var popularity=m.popularityRank?'<div style="font-size:9px;letter-spacing:.45px;color:var(--accent);margin-top:2px">DEEZER RANK '+formatPopularity(m.popularityRank)+(m.artistFans?' · '+formatPopularity(m.artistFans)+' FANS':'')+'</div>':'';
    return'<button class="res" data-id="'+esc(m.id)+'">'+cover(m,P+m.id)+'<div><div class="t">'+esc(m.title)+'</div><div class="a">'+meta+'</div>'+popularity+'</div></button>'}).join("");
  box.querySelectorAll(".res").forEach(function(b){
    b.onclick=function(){pick(b.dataset.id)};
    var m=found[b.dataset.id];if(m.cover||!isMb(m.id))return;
    dzFind(m.title,m.artist).then(function(d){setCover(P+m.id,d?(d.cover_medium||d.cover_big):caa(m.id))},function(){setCover(P+m.id,caa(m.id))});
  });
}

/* ---------- album ---------- */
var alb={};
async function loadAlbum(id){
  if(store.mine[id])return store.mine[id];
  if(alb[id])return alb[id];
  var a;
  if(!isMb(id)){
    var dd=await jsonp(DZ+"album/"+id);if(!dd||dd.error)throw new Error("deezer");
    a={id:id,title:dd.title,artist:(dd.artist&&dd.artist.name)||"",year:(dd.release_date||"").slice(0,4),cover:dd.cover_big||dd.cover_medium||"",tracks:await dzTracks(id)};
    if(!a.tracks.length)throw new Error("no tracks available");
  }else{
    var m=found[id];
    if(!m){var rg=await j(MB+"release-group/"+id+"?fmt=json&inc=artist-credits");m={id:id,title:rg.title,artist:artistOf(rg),year:(rg["first-release-date"]||"").slice(0,4)}}
    a={id:id,title:m.title,artist:m.artist,year:m.year,cover:"",tracks:[]};
    try{var d=await dzFind(m.title,m.artist);if(d){a.cover=d.cover_big||d.cover_medium||"";a.tracks=await dzTracks(d.id)}}catch(e){}
    if(!a.tracks.length)a.tracks=await mbTracks(id);
    if(!a.tracks.length)throw new Error("no tracks available");
  }
  alb[id]=a;return a}
async function openAlbum(id){
  if(store.mine[id])return page(store.mine[id]);
  app.innerHTML=shell('<div class="msg">Loading album…</div>',"");bindMenu();
  try{var a=await loadAlbum(id);if(location.hash!=="#a="+id)return;page(a)}
  catch(e){if(location.hash!=="#a="+id)return;app.innerHTML=shell('<button class="btn ghost" id="albumRetryBack">← Back</button><div class="msg">Could not load this album. Try again.</div>',"");bindMenu();$("#albumRetryBack").onclick=function(){location.hash=albumReturnHash||""}}
}
function roles(a){
  var v=a.tracks.filter(function(t){return t.r!=null}).map(function(t){return t.r});
  if(v.length<2)return{};
  var hi=Math.max.apply(null,v),lo=Math.min.apply(null,v);
  return hi>lo?{hi:hi,lo:lo}:{}}
function trk(a,i,R,sym){
  var t=a.tracks[i],cls="",tag="";
  if(t.r!=null){
    if(t.r===R.hi){cls=" best";tag=sym?"▲":"BEST"}
    else if(t.r===R.lo){cls=" worst";tag=sym?"▼":"WORST"}
    else cls=" rated";if(t.r<=2)cls+=" low"}
  var noteMark=t.note?'<span class="note-indicator" title="'+esc(t.note)+'">NOTE</span>':"";
  return'<button class="tr'+cls+'" data-i="'+i+'"'+(t.r==null?"":' style="--w:'+(t.r*10)+'%"')+'><span class="n">'+(i+1)+'</span><span class="nm">'+esc(t.name)+'</span>'+noteMark+(tag?'<span class="tag">'+tag+'</span>':'')+'<span class="pill'+(t.r==null?" none":"")+'">'+(t.r==null?"–":t.r.toFixed(1))+'</span></button>'}
function ring(m){
  var c=2*Math.PI*36,color=m==null?"#888":col(m);
  return'<div class="ring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="42" cy="42" r="36" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(c*(m==null?0:m/10))+' '+c+'" transform="rotate(-90 42 42)"/></svg><b style="color:'+color+'">'+(m==null?"—":m.toFixed(1))+'<small>/10</small></b></div>'}
function page(a,ro,by){
  cur=a;var m=avg(a),n=a.tracks.filter(function(t){return t.r!=null}).length;
  var h='<button class="btn ghost" id="bk" style="margin-bottom:12px">← Back</button>';
  h+='<div class="head">'+cover(a)+'<div class="info"><h2>'+esc(a.title)+'</h2><div class="a">'+esc(a.artist)+(a.year?" · "+esc(a.year):"")+'</div>'+(by?'<div class="by">Rated by @'+esc(by)+'<small class="by-disclaimer">Listener rating · not an official score</small></div>':'<div class="cnt">'+n+" / "+a.tracks.length+' tracks rated</div>')+'</div>'+ring(m)+'</div>';
  var R=roles(a);
  h+='<div class="tracks">'+a.tracks.map(function(t,i){return trk(a,i,R)}).join("")+'</div>';
  h+='<div class="row">'+(ro?'<button class="btn" id="mine">Rate this album too</button>':(store.mine[a.id]?'<button class="btn ghost" id="del">Delete</button>':'')+'<button class="btn ghost" id="vsa">Album vs album</button><button class="btn" id="share">Share link</button>')+'</div>';
  app.innerHTML=shell(h,"");bindMenu();
  $("#bk").onclick=function(){location.hash=albumReturnHash||""};
  if(ro){$("#mine").onclick=function(){if(!store.mine[a.id]){store.mine[a.id]={id:a.id,title:a.title,artist:a.artist,year:a.year,cover:a.cover,tracks:a.tracks.map(function(t){return{name:t.name,r:null}})};save()}location.hash="#a="+a.id}}
  else{
    $("#share").onclick=function(){if(avg(a)==null){toast("Rate at least one track first");return}shareLink(a)};
    var dl=$("#del");if(dl)dl.onclick=function(){if(confirm("Remove this album from your list?")){delete store.mine[a.id];delete alb[a.id];save();location.hash=albumReturnHash||""}};
    $("#vsa").onclick=function(){location.hash="#v="+a.id+","};
    app.querySelectorAll(".tr").forEach(function(b){b.onclick=function(){rate(a,+b.dataset.i,function(){page(a)})}})}
}
function rate(a,i,re){
  var t=a.tracks[i],d=$("#dlg"),last=i>=a.tracks.length-1;
  d.innerHTML='<div class="rating-dialog-head"><div><div class="eyebrow">TRACK '+(i+1)+' OF '+a.tracks.length+'</div><h2>'+esc(t.name)+'</h2></div><button class="icon-close" id="closeRate" aria-label="Close rating">×</button></div><div class="rating-score"><input class="big score-inline" id="scoreInput" type="number" min="0" max="10" step="0.1" inputmode="decimal" value="'+(t.r==null?"5.0":t.r.toFixed(1))+'" aria-label="Your score from 0 to 10"><span>OUT OF 10</span><div id="bl"></div></div><input class="rating-range" type="range" id="rg" min="0" max="10" step="0.1" value="'+(t.r==null?5:t.r)+'" aria-label="Adjust score from 0 to 10"><label class="note-label" for="trackNote">Track note <span>optional</span></label><textarea id="trackNote" maxlength="300" placeholder="A detail, a lyric, a memory…">'+esc(t.note||"")+'</textarea><div class="row rating-actions"><button class="btn ghost" id="cl">Clear rating</button><button class="btn ghost" id="ok">Done</button>'+(last?'':'<button class="btn" id="nx">Next track →</button>')+'</div>';
  var rg=d.querySelector("#rg"),scoreInput=d.querySelector("#scoreInput");
  function paint(x,writeValue){if(writeValue!==false)scoreInput.value=x.toFixed(1);scoreInput.style.color=col(x);d.style.setProperty("--c",col(x));d.querySelector("#bl").textContent=LAB[Math.round(x)]}
  scoreInput.onfocus=function(){scoreInput.select()};
  rg.oninput=function(){scoreInput.value=(+rg.value).toFixed(1);paint(+rg.value,false)};
  scoreInput.oninput=function(){
    if(scoreInput.value===""){d.querySelector("#bl").textContent="Enter a score";return}
    var x=Number(scoreInput.value);if(!Number.isFinite(x))return;
    if(x<0){x=0;scoreInput.value="0"}else if(x>10){x=10;scoreInput.value="10"}
    rg.value=x;paint(x,false);
  };
  scoreInput.onblur=function(){
    if(scoreInput.value===""){scoreInput.value=(+rg.value).toFixed(1);paint(+rg.value);return}
    var x=Math.round(Math.max(0,Math.min(10,Number(scoreInput.value)))*10)/10;
    scoreInput.value=x.toFixed(1);rg.value=x;paint(x,false);
  };
  paint(+(t.r==null?5:t.r));
  function done(val,next){
    if(val!==null){
      if(scoreInput.value===""){toast("Enter a score from 0 to 10");scoreInput.focus();return}
      var numeric=Number(scoreInput.value);
      if(!Number.isFinite(numeric)){toast("Enter a score from 0 to 10");scoreInput.focus();return}
      val=Math.round(Math.max(0,Math.min(10,numeric))*10)/10;
    }
    var note=d.querySelector("#trackNote").value.trim();if(note)t.note=note;else delete t.note;
    t.r=val;a.u=Date.now();store.mine[a.id]=a;save();d.close();re();if(next)rate(a,i+1,re);
  }
  d.querySelector("#ok").onclick=function(){done(Number(scoreInput.value))};
  d.querySelector("#cl").onclick=function(){done(null)};
  var nx=d.querySelector("#nx");if(nx)nx.onclick=function(){done(Number(scoreInput.value),true)};
  var close=d.querySelector("#closeRate");if(close)close.onclick=function(){d.close()};
  d.showModal();
}
function shared(p){
  page({id:p.i,title:p.t,artist:p.a,year:p.y,cover:imgOk(p.c)?p.c:"",tracks:p.k.map(function(n,i){return{name:n,r:p.r[i]}})},true,p.n);
}
/* ---------- Album vs album ---------- */
var vtok=0;
function versus(s){
  var tok=vtok,p=s.split(","),ids=[(p[0]||"").trim(),(p[1]||"").trim()],win=-1,err=[false,false];
  var al=ids.map(function(id){return id?(store.mine[id]||alb[id]||null):null});
  cur=null;app.className="wrap wide";
  function setIds(n){location.hash="#v="+n.join(",")}
  function slot(k){
    var a=al[k],name=k?"B":"A";
    if(!ids[k])return'<div class="slot"><div class="vh"><div class="vname">ALBUM '+name+'</div><input id="vq'+k+'" type="search" placeholder="Search for an album…" autocomplete="off"><div id="vr'+k+'" class="vres"></div></div></div>';
    if(err[k])return'<div class="slot"><div class="vh"><div class="msg">Could not load album '+name+'.</div><button class="btn ghost" data-ch="'+k+'">Choose another</button></div></div>';
    if(!a)return'<div class="slot"><div class="vh"><div class="msg">Loading…</div></div></div>';
    var m=avg(a),n=a.tracks.filter(function(t){return t.r!=null}).length,R=roles(a);
    return'<div class="slot"><div class="vh'+(win===k?" win":"")+'">'+(win===k?'<span class="crown">WINNER</span>':'')+cover(a)+'<h2>'+esc(a.title)+'</h2><div class="a">'+esc(a.artist)+(a.year?" · "+esc(a.year):"")+'</div>'+ring(m)+'<div class="cnt">'+n+" / "+a.tracks.length+' tracks rated</div><button class="btn" data-all="'+k+'">'+(n?"Continue rating":"Rate tracks")+'</button><button class="btn ghost" data-ch="'+k+'">Change album</button></div><div class="tracks">'+a.tracks.map(function(t,i){return trk(a,i,R,true)}).join("")+'</div></div>'}
  function draw(){
    if(tok!==vtok)return;
    var am=al.map(function(a){return a?avg(a):null}),vd;
    win=(am[0]!=null&&am[1]!=null&&Math.abs(am[0]-am[1])>0.004)?(am[0]>am[1]?0:1):-1;
    if(win>=0)vd=esc(al[win].title)+" wins · "+am[win].toFixed(1)+" vs "+am[1-win].toFixed(1);
    else if(am[0]!=null&&am[1]!=null)vd="Tie · "+am[0].toFixed(1)+" each";
    else vd='<span style="color:var(--mute);font-weight:500;font-size:14px">Choose two albums and rate their tracks to see the winner</span>';
    app.innerHTML=shell('<button class="btn ghost" id="bk" style="margin-bottom:12px">← Back</button><div class="verdict">'+vd+'</div><div class="vs">'+slot(0)+slot(1)+'</div>',"versus");bindMenu();
    $("#bk").onclick=function(){location.hash=""};
    app.querySelectorAll("[data-ch]").forEach(function(b){b.onclick=function(){var n=ids.slice();n[+b.dataset.ch]="";setIds(n)}});
    app.querySelectorAll("[data-all]").forEach(function(b){b.onclick=function(){
      var a=al[+b.dataset.all],i=a.tracks.findIndex(function(t){return t.r==null});rate(a,i<0?0:i,draw)}});
    var sl=app.querySelectorAll(".slot");
    [0,1].forEach(function(k){
      if(al[k])sl[k].querySelectorAll(".tr").forEach(function(b){b.onclick=function(){rate(al[k],+b.dataset.i,draw)}});
      var q=$("#vq"+k);if(!q)return;
      q.oninput=function(){clearTimeout(timer);var v=this.value;timer=setTimeout(function(){
        search(v,$("#vr"+k),function(id){
          if(id===ids[1-k]){toast("Choose a different album");return}
          var n=ids.slice();n[k]=id;setIds(n)})},650)}})
  }
  ids.forEach(function(id,k){
    if(!id||al[k])return;
    loadAlbum(id).then(function(a){al[k]=a;draw()},function(){err[k]=true;draw()})});
  draw();
}
function route(){
  var h=location.hash;vtok++;app.className="wrap";
  try{
    if(h.indexOf("#s=")===0)shared(dec(h.slice(3)));
    else if(h.indexOf("#a=")===0)openAlbum(h.slice(3));
    else if(h.indexOf("#v=")===0)versus(h.slice(3));
    else if(h==="#rate")ratePage();
    else if(h==="#ratings")home(true);
    else home();
  }catch(e){home()}
}
function syncThemeButton(){
  var dark=document.documentElement.dataset.theme==="dark",button=$("#theme");
  if(!button)return;
  button.querySelector(".theme-icon").textContent=dark?"☼":"☾";
  button.setAttribute("aria-label",dark?"Switch to light mode":"Switch to dark mode");
}
addEventListener("hashchange",route);
route();
</script>
