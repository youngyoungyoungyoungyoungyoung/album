.tracks{display:grid;grid-template-columns:1fr;gap:0;margin-top:16px}

.tr{position:relative;overflow:hidden;display:flex;align-items:center;gap:9px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 4px;width:100%;text-align:left;border-radius:0;transition:background .1s}
.tr::before{content:none}.tr:hover{background:var(--paper);transform:none;box-shadow:none}.tr:active{transform:none}

.pill{min-width:40px;text-align:center;padding:2px 5px;border-radius:0;border:1px solid var(--line);font-weight:700;font-size:11px}
.pill.none{border-color:transparent;color:var(--soft)}
.tr.rated{--c:var(--accent)}.tr.best{--c:var(--mint)}.tr.worst{--c:var(--coral)}
.tr.rated .pill,.tr.best .pill,.tr.worst .pill{color:var(--c);border-color:color-mix(in srgb,var(--c) 60%,var(--line));background:transparent}
.tag{flex:none;font-size:8px;font-weight:700;letter-spacing:1px;color:var(--c)}
.wrap.wide{max-width:none}.vs{display:grid;grid-template-columns:1fr 1fr;gap:25px}.slot{min-width:0}
.vh{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 0 16px}

.vs .tracks{grid-template-columns:1fr;margin-top:10px;gap:0}.vs .tr{padding:8px 2px;gap:5px;font-size:11px}.vs .tr .n{width:17px;font-size:9px}.vs .pill{min-width:32px;padding:2px 3px;font-size:10px}

var popularAlbumPromise=null;
function matchingRatedAlbum(album){
  var list=Object.keys(store.mine).map(function(id){return store.mine[id]});
  for(var i=0;i<list.length;i++)if(String(list[i].id)===String(album.id))return list[i];
  var title=norm(album.title),artist=norm(album.artist&&album.artist.name);
  for(var j=0;j<list.length;j++)if(norm(list[j].title)===title&&norm(list[j].artist)===artist)return list[j];
  return null;
}
function loadPopularAlbum(){
  if(popularAlbumPromise)return popularAlbumPromise;
  popularAlbumPromise=jsonp(DZ+"chart/0/albums?limit=50").then(function(d){
    var albums=(d&&d.data)||((d&&d.albums&&d.albums.data)||[]);
    albums=albums.filter(function(a){return a&&a.id&&isAlbumType(a.record_type||"album")});
    if(!albums.length)throw new Error("No current chart albums");
    var cutoff=new Date();cutoff.setMonth(cutoff.getMonth()-24);
    var ranked=albums.slice().sort(function(a,b){return(+b.rank||0)-(+a.rank||0)}).slice(0,12);
    return Promise.allSettled(ranked.map(function(a){return jsonp(DZ+"album/"+a.id)})).then(function(details){
      var candidates=ranked.map(function(a,i){
        var detail=details[i].status==="fulfilled"?details[i].value:null;
        if(detail&&!detail.error){
          if(detail.release_date)a.release_date=detail.release_date;
          if(!a.cover_medium)a.cover_medium=detail.cover_medium||detail.cover_big||"";
          if(!a.record_type&&detail.record_type)a.record_type=detail.record_type;
        }
        return a;
      });
      var recent=candidates.filter(function(a){return a.release_date&&new Date(a.release_date)>=cutoff});
      if(recent.length){recent.sort(function(a,b){return(b.release_date||"").localeCompare(a.release_date||"")||(+b.rank||0)-(+a.rank||0)});return recent[0]}
      candidates.sort(function(a,b){return(+b.rank||0)-(+a.rank||0)});
      return candidates[0];
    });
  }).catch(function(){popularAlbumPromise=null;return null});
  return popularAlbumPromise;

    if(!ids[k])return'<div class="slot"><div class="vh"><div class="vname">ALBUM '+name+'</div><input id="vq'+k+'" type="search" placeholder="Search for an album…" autocomplete="off"><div id="vr'+k+'" class="vres"></div></div></div>';
    if(err[k])return'<div class="slot"><div class="vh"><div class="msg">Could not load album '+name+'.</div><button class="btn ghost" data-ch="'+k+'">Choose another</button></div></div>';
    if(!a)return'<div class="slot"><div class="vh"><div class="msg">Loading…</div></div></div>';
    var m=avg(a),n=a.tracks.filter(function(t){return t.r!=null}).length,R=roles(a);
    return'<div class="slot"><div class="vh'+(win===k?" win":"")+'">'+(win===k?'<span class="crown">WINNER</span>':'')+cover(a)+'<h2>'+esc(a.title)+'</h2><div class="a">'+esc(a.artist)+(a.year?" · "+esc(a.year):"")+'</div>'+ring(m)+'<div class="cnt">'+n+" / "+a.tracks.length+' tracks rated</div><button class="btn" data-all="'+k+'">'+(n?"Continue rating":"Rate tracks")+'</button><button class="btn ghost" data-ch="'+k+'">Change album</button></div><div class="tracks">'+a.tracks.map(function(t,i){return trk(a,i,R,true)}).join("")+'</div></div>'}
  function draw(){
    if(tok!==vtok)return;
    var am=al.map(function(a){return a?avg(a):null}),vd;
    win=(am[0]!=null&&am[1]!=null&&Math.abs(am[0]-am[1])>0.004)?(am[0]>am[1]?0:1):-1;
    if(win>=0)vd=esc(al[win].title)+" wins · "+am[win].toFixed(1)+" vs "+am[1-win].toFixed(1);
    else if(am[0]!=null&&am[1]!=null)vd="Tie · "+am[0].toFixed(1)+" each";
    else vd='<span style="color:var(--mute);font-weight:500;font-size:14px">Choose two albums and rate their tracks to see the winner</span>';
    app.innerHTML=shell('<button class="btn ghost" id="bk" style="margin-bottom:12px">← Back</button><div class="verdict">'+vd+'</div><div class="vs">'+slot(0)+slot(1)+'</div>',"versus");bindMenu();
    $("#bk").onclick=function(){location.hash=""};
    app.querySelectorAll("[data-ch]").forEach(function(b){b.onclick=function(){var n=ids.slice();n[+b.dataset.ch]="";setIds(n)}});
    app.querySelectorAll("[data-all]").forEach(function(b){b.onclick=function(){
      var a=al[+b.dataset.all],i=a.tracks.findIndex(function(t){return t.r==null});rate(a,i<0?0:i,draw)}});
    var sl=app.querySelectorAll(".slot");
    [0,1].forEach(function(k){
      if(al[k])sl[k].querySelectorAll(".tr").forEach(function(b){b.onclick=function(){rate(al[k],+b.dataset.i,draw)}});
      var q=$("#vq"+k);if(!q)return;
      q.oninput=function(){clearTimeout(timer);var v=this.value;timer=setTimeout(function(){
        search(v,$("#vr"+k),function(id){
          if(id===ids[1-k]){toast("Choose a different album");return}
          var n=ids.slice();n[k]=id;setIds(n)})},650)}})
  }
  ids.forEach(function(id,k){
    if(!id||al[k])return;
    loadAlbum(id).then(function(a){al[k]=a;draw()},function(){err[k]=true;draw()})});
  draw();
}
function route(){
  var h=location.hash;vtok++;app.className="wrap";
  try{
    if(h.indexOf("#s=")===0)shared(dec(h.slice(3)));
    else if(h.indexOf("#a=")===0)openAlbum(h.slice(3));
    else if(h.indexOf("#v=")===0)versus(h.slice(3));
    else if(h==="#rate")ratePage();
    else if(h==="#ratings")home(true);
    else home();
  }catch(e){home()}
}
function syncThemeButton(){
  var dark=document.documentElement.dataset.theme==="dark",button=$("#theme");
  if(!button)return;
  button.querySelector(".theme-icon").textContent=dark?"☼":"☾";
  button.setAttribute("aria-label",dark?"Switch to light mode":"Switch to dark mode");
}
addEventListener("hashchange",route);
route();
</script>
</body>
</html>
