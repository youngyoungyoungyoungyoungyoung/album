<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}

button{font:inherit;color:inherit;cursor:pointer}

.tracks{display:grid;grid-template-columns:1fr;gap:0;margin-top:16px}

.tr{position:relative;overflow:hidden;display:flex;align-items:center;gap:9px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 4px;width:100%;text-align:left;border-radius:0;transition:background .1s}
.tr::before{content:none}.tr:hover{background:var(--paper);transform:none;box-shadow:none}.tr:active{transform:none}
.tr>*{position:relative}.tr .n{flex:none;width:22px;color:var(--soft);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.tr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{min-width:40px;text-align:center;padding:2px 5px;border-radius:0;border:1px solid var(--line);font-weight:700;font-size:11px}
.pill.none{border-color:transparent;color:var(--soft)}
.tr.rated{--c:var(--accent)}.tr.best{--c:var(--mint)}.tr.worst{--c:var(--coral)}
.tr.rated .pill,.tr.best .pill,.tr.worst .pill{color:var(--c);border-color:color-mix(in srgb,var(--c) 60%,var(--line));background:transparent}
.tag{flex:none;font-size:8px;font-weight:700;letter-spacing:1px;color:var(--c)}
.wrap.wide{max-width:none}.vs{display:grid;grid-template-columns:1fr 1fr;gap:25px}.slot{min-width:0}
.vh{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 0 16px}
.vh .cover{width:min(100%,205px);border-radius:0}.vh h2{font:600 20px/1.1 "Oswald","Arial Narrow",sans-serif;text-transform:uppercase;margin:0;overflow-wrap:anywhere}
.vh .a{color:var(--soft);font-size:11px}.vh .cnt{font-size:10px;color:var(--soft);text-transform:uppercase}.vh .btn{font-size:10px;padding:8px 10px}
.vh.win{box-shadow:none}.crown{position:static;background:var(--mint);color:#111;font-weight:700;font-size:9px;letter-spacing:1px;padding:4px 7px;border-radius:0}
.vname{font-weight:700;color:var(--accent);letter-spacing:1.4px;font-size:10px}.vres{width:100%;text-align:left}.vres .res{padding:6px}.vres .res .cover{width:40px}
.vs .tracks{grid-template-columns:1fr;margin-top:10px;gap:0}.vs .tr{padding:8px 2px;gap:5px;font-size:11px}.vs .tr .n{width:17px;font-size:9px}.vs .pill{min-width:32px;padding:2px 3px;font-size:10px}
.verdict{text-align:left;font:600 23px/1.1 "Oswald","Arial Narrow",sans-serif;text-transform:uppercase;margin:5px 0 22px}.vs .head{display:block}
.row{display:flex;gap:8px;justify-content:flex-start;margin-top:18px;flex-wrap:wrap}

.big{font:700 68px/1 "Oswald","Arial Narrow",sans-serif;text-align:center;letter-spacing:-1px;text-shadow:none;color:var(--accent)}
input[type=range]{padding:0;margin:14px 0;border:0;background:transparent;accent-color:var(--accent)}
.quick{display:flex;gap:3px}.quick button{flex:1;border:1px solid var(--line)!important;border-radius:0;padding:7px 0;font-weight:700;font-size:12px;background:transparent!important;color:var(--ink)!important}
.quick button:hover{border-color:var(--accent)!important}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 13px;border-radius:0;font-weight:700;font-size:11px;z-index:20}
.theme{position:fixed;right:18px;top:15px;z-index:12;display:flex;padding:2px;gap:2px;border-radius:0;border:1px solid var(--line);background:var(--bg);box-shadow:none;cursor:pointer}
.theme span{width:29px;height:25px;border-radius:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--soft)}
:root[data-theme="dark"] .theme [data-t="dark"],:root[data-theme="light"] .theme [data-t="light"]{background:var(--paper);color:var(--ink)}
@media(max-width:760px){.sidebar{display:none}.main{margin:0;padding:18px 16px 80px}.mobilebar{display:flex;align-items:center;justify-content:space-between;margin:-18px -16px 23px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}.mobilebar .brand{padding:0;font-size:19px}.menu-toggle{border:1px solid var(--line);background:transparent;border-radius:0;padding:6px 9px;font-size:11px;text-transform:uppercase}.mobile-nav{display:none;position:absolute;top:52px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px 12px;z-index:11}.mobile-nav.open{display:grid}.mobile-nav button{border:0;background:transparent;text-align:left;padding:10px 4px;color:var(--soft);text-transform:uppercase;font-size:11px;letter-spacing:1px}.hero{grid-template-columns:1fr .8fr;gap:14px;margin:10px 0 30px}.hero-art{min-height:230px;padding:12px}.art-note{left:12px;bottom:12px;padding:8px}.art-sticker{right:7px;bottom:8px}.head{gap:13px}.head .cover{width:96px}.ring{width:57px;height:57px}.ring b{font-size:16px}.vs{gap:13px}}
@media(max-width:500px){.hero{grid-template-columns:1fr}.hero-art{min-height:190px}.record{width:180px;right:2%;top:0}.art-note{max-width:58%}.vs{grid-template-columns:1fr}.head{align-items:flex-start}.head .cover{width:78px}.ring{width:52px;height:52px}.ring b{font-size:14px}.tracks{grid-template-columns:1fr}}
</style>

<style>
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:20px 0 30px}
.stat{min-height:78px;padding:12px;background:var(--mint);color:#111;border:1px solid #111;display:flex;flex-direction:column;justify-content:space-between}
.stat:nth-child(2){background:var(--coral)}.stat:nth-child(3){background:var(--pink)}
.stat span{font-size:8px;font-weight:700;letter-spacing:1px}.stat strong{font:700 30px/1 "Oswald","Arial Narrow",sans-serif}
.empty-note{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:26px 0;padding:18px 20px;background:var(--accent);color:#111;border:1px solid #111}
.empty-note span{font-size:9px;letter-spacing:1px;font-weight:700}.empty-note strong{font:600 23px/1.05 "Oswald","Arial Narrow",sans-serif;text-align:right;text-transform:uppercase}
@media(max-width:500px){.stats{gap:5px}.stat{min-height:64px;padding:8px}.stat strong{font-size:24px}.stat span{font-size:7px}.empty-note{align-items:flex-start;flex-direction:column}.empty-note strong{text-align:left}}
</style>
<style>
.note-label{display:block;margin-top:17px;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.note-label span{color:var(--mute);font-weight:400;text-transform:none;letter-spacing:0;margin-left:4px}
#trackNote{display:block;min-height:76px;margin-top:6px;resize:vertical;border:1px solid var(--line);border-radius:0;background:var(--paper);color:var(--ink);font:13px/1.5 "DM Sans",system-ui,sans-serif}
#trackNote::placeholder{color:var(--mute)}
.note-indicator{flex:none;color:var(--accent);font-size:8px;font-weight:700;letter-spacing:.7px}

<body>
<button class="theme" id="theme" aria-label="Switch theme (dark / light)"><span data-t="dark">☾</span><span data-t="light">☀</span></button>
<div class="wrap" id="app"></div>
<dialog id="dlg"></dialog>

<script>
var MB="https://musicbrainz.org/ws/2/",DZ="https://api.deezer.com/";
var COL=["#8f4138","#a94a3d","#bf5343","#cc684a","#c17b46","#a88356","#71836a","#5f806b","#4c795f","#3f765b","#347551"];
var LAB=["Awful","Terrible","Bad","Below average","Okay","Average","Good","Very good","Great","Excellent","Masterpiece"];
var $=function(s){return document.querySelector(s)};
var app=$("#app"),store={nick:"",mine:{}},cur=null,found={};
try{var sv=JSON.parse(localStorage.getItem("rate2")||"{}");if(sv.mine)store=sv}catch(e){}
function save(){try{localStorage.setItem("rate2",JSON.stringify(store))}catch(e){}}
function col(s){return COL[Math.max(0,Math.min(10,Math.round(s)))]}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s||"").toLowerCase().replace(/[^\p{L}\p{N}]/gu,"")}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function grad(s){var h=hue(s);return"linear-gradient(145deg,hsl("+h+",24%,48%),hsl("+((h+34)%360)+",28%,30%))"}
function avg(a){var v=a.tracks.filter(function(t){return t.r!=null});return v.length?v.reduce(function(s,t){return s+t.r},0)/v.length:null}
function isMb(id){return String(id).indexOf("-")>0}
function caa(id){return isMb(id)?"https://coverartarchive.org/release-group/"+id+"/front-250":""}
function imgOk(u){return typeof u==="string"&&/^https:\/\/[a-z0-9.-]*dzcdn\.net\//i.test(u)}
function artistOf(x){return(x["artist-credit"]||[]).map(function(c){return(c.name||"")+(c.joinphrase||"")}).join("")}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function cover(a,id){
  var u=a.cover||(id?"":caa(a.id));
  return'<div class="cover"'+(id?' id="'+id+'"':'')+' style="background:'+grad(a.title+a.artist)+'">'+esc((a.title||"?").charAt(0).toUpperCase())+(u?'<img alt="" src="'+esc(u)+'" onerror="this.remove()">':'')+'</div>';
}
function setCover(id,u){var el=document.getElementById(id);if(!el||!u)return;var im=el.querySelector("img");if(im)im.remove();var n=document.createElement("img");n.alt="";n.src=u;n.onerror=function(){n.remove()};el.appendChild(n)}

async function j(url){
  for(var i=0;i<3;i++){
    try{var r=await fetch(url);if(r.ok)return r.json();if(r.status!==503&&r.status!==429)throw new Error("HTTP "+r.status)}
    catch(e){if(i===2||/^HTTP/.test(e.message))throw e}
    await new Promise(function(k){setTimeout(k,1300)})}
  throw new Error("MusicBrainz is busy")}
var jc=0;
function jsonp(url){return new Promise(function(ok,no){
  var n="__dz"+(++jc),s=document.createElement("script"),t=setTimeout(fail,7000);
  function clean(){clearTimeout(t);delete window[n];s.remove()}
  function fail(){clean();no(new Error("jsonp"))}
  window[n]=function(d){clean();ok(d)};
  s.onerror=fail;s.src=url+(url.indexOf("?")<0?"?":"&")+"output=jsonp&callback="+n;document.head.appendChild(s)})}

/* ---------- Deezer: artwork + tracklist ---------- */
var dzc={};
function dzFind(title,artist){
  var key=artist+"|"+title;if(dzc[key])return dzc[key];
  var T=title.replace(/"/g,""),A=artist.replace(/"/g,"");
  function same(d){
    var a1=norm(d.artist&&d.artist.name),a2=norm(artist),t1=norm(d.title),t2=norm(title);
    return(a1.indexOf(a2.slice(0,5))>=0||a2.indexOf(a1.slice(0,5))>=0)&&(t1.indexOf(t2.slice(0,5))>=0||t2.indexOf(t1.slice(0,5))>=0)}
  var p=(async function(){
    var qs=['artist:"'+A+'" album:"'+T+'"',A+" "+T];
    for(var i=0;i<qs.length;i++){
      var d=await jsonp(DZ+"search/album?limit=5&q="+encodeURIComponent(qs[i]));
      var hit=((d&&d.data)||[]).filter(same)[0];if(hit)return hit}
    return null})();
  dzc[key]=p;p.catch(function(){delete dzc[key]});return p;
}
async function dzTracks(id){var d=await jsonp(DZ+"album/"+id+"/tracks?limit=100");return(d.data||[]).map(function(t){return{name:t.title,r:null}})}
async function mbTracks(id){
  var rg=await j(MB+"release-group/"+id+"?fmt=json&inc=releases");
  var rels=(rg.releases||[]).slice().sort(function(a,b){var x=a.status==="Official"?0:1,y=b.status==="Official"?0:1;return x-y||(a.date||"9999").localeCompare(b.date||"9999")});
  if(!rels.length)return[];
  var rel=await j(MB+"release/"+rels[0].id+"?fmt=json&inc=recordings"),tr=[];
  (rel.media||[]).forEach(function(m){(m.tracks||[]).forEach(function(t){tr.push({name:t.title,r:null})})});return tr}

/* ---------- share links (all data in URL) ---------- */
function enc(o){var b=new TextEncoder().encode(JSON.stringify(o)),s="";b.forEach(function(c){s+=String.fromCharCode(c)});return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function dec(s){s=s.replace(/-/g,"+").replace(/_/g,"/");var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u))}
function shareLink(a){
  if(!store.nick){var n=prompt("Choose a nickname for your rating:");if(!n)return;store.nick=n.trim().slice(0,24);save()}
  var p={n:store.nick,i:a.id,t:a.title,a:a.artist,y:a.year,c:a.cover||"",k:a.tracks.map(function(t){return t.name}),r:a.tracks.map(function(t){return t.r})};
  var link=location.href.split("#")[0]+"#s="+enc(p),title=a.title+" – rated by @"+store.nick;
  if(navigator.share){navigator.share({title:title,url:link}).catch(function(){})}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(link).then(function(){toast("Link copied!")},function(){prompt("Copy this link:",link)})}
  else prompt("Copy this link:",link);
}

/* ---------- home + search ---------- */

async function mbSearch(words){
  var A=words.map(function(w){return w+"*"}).join(" AND "),seen={};
  var d=await j(MB+"release-group?fmt=json&limit=30&query="+encodeURIComponent("("+A+") OR releasegroup:("+A+") OR artist:("+A+")"));
  return(d["release-groups"]||[]).filter(function(x){
    if(x["primary-type"]!=="Album"&&x["primary-type"]!=="EP")return false;
    var k=norm(x.title)+norm(artistOf(x));if(seen[k])return false;seen[k]=1;return true}).slice(0,18).map(function(x){
    return{id:x.id,title:x.title,artist:artistOf(x),year:(x["first-release-date"]||"").slice(0,4),source:"mb",recordType:"album",rank:0}})}
function isAlbumType(value){
  var type=String(value||"").toLowerCase();
  return type==="album"||type==="ep"||type==="compilation"||type==="live";
}
async function dzSearch(words){
  var d=await jsonp(DZ+"search/album?limit=30&q="+encodeURIComponent(words.join(" ")));
  return((d&&d.data)||[]).filter(function(x){return isAlbumType(x.record_type)}).map(function(x){return{id:String(x.id),title:x.title,artist:(x.artist&&x.artist.name)||"",year:(x.release_date||"").slice(0,4),cover:x.cover_medium||x.cover_big||"",source:"dz",recordType:x.record_type,rank:+x.rank||0,popularityRank:+x.rank||0}});
}
function artistMatchScore(name,words){
  var n=norm(name),q=norm(words.join(" "));
  if(!n||!q)return 0;
  if(n===q)return 10000;
  if(n.indexOf(q)>=0)return 6000;
  return words.every(function(w){return n.indexOf(norm(w))>=0})?4000:0;
}
async function dzArtistAlbums(words){
  if(words.length>3)return[];
  var q=words.join(" ");
  var response=await jsonp(DZ+"search/artist?limit=10&q="+encodeURIComponent(q));
  var artists=(response&&response.data)||[];
  artists=artists.map(function(a){return{data:a,score:artistMatchScore(a.name||"",words)}})
    .filter(function(a){return a.score>=4000})
    .sort(function(a,b){return b.score-a.score||(+b.data.nb_fan||0)-(+a.data.nb_fan||0)});
  if(!artists.length)return[];
  var artist=artists[0].data,base=DZ+"artist/"+artist.id;
  var details=await Promise.allSettled([
    jsonp(base+"/albums?limit=100"),
    jsonp(base+"/top?limit=50")
  ]);
  var byId={};
  function addAlbum(album){
    if(!album||!album.id)return null;
    var id=String(album.id),entry=byId[id];
    if(!entry){
      entry=byId[id]={id:id,title:album.title||"",artist:artist.name||"",year:(album.release_date||"").slice(0,4),cover:album.cover_medium||album.cover_big||album.cover||"",source:"dz-artist",recordType:album.record_type||"",rank:+album.rank||0,popularityRank:+album.rank||0,trackRanks:[],artistFans:+artist.nb_fan||0,artistExact:true};
    }else{
      entry.rank=Math.max(entry.rank||0,+album.rank||0);
      if(album.record_type)entry.recordType=album.record_type;
      entry.popularityRank=Math.max(entry.popularityRank||0,+album.rank||0);
      if(!entry.cover)entry.cover=album.cover_medium||album.cover_big||album.cover||"";
      if(!entry.year&&album.release_date)entry.year=album.release_date.slice(0,4);
    }
    return entry;
  }
  if(details[0].status==="fulfilled")((details[0].value&&details[0].value.data)||[]).filter(function(album){return isAlbumType(album.record_type)}).forEach(addAlbum);
  if(details[1].status==="fulfilled")((details[1].value&&details[1].value.data)||[]).forEach(function(track){
    var album=track.album||{},entry=byId[String(album.id)]||null;
    if(!entry&&isAlbumType(album.record_type))entry=addAlbum(album);
    if(entry){
      var rank=+track.rank||0;
      if(rank>0){entry.trackRanks.push(rank);entry.popularityRank=Math.max(entry.popularityRank||0,rank)}
    }
  });
  return Object.keys(byId).map(function(id){
    var album=byId[id],ranks=album.trackRanks.sort(function(a,b){return b-a});
    album.trackSignals=ranks.length;
    album.trackPopularity=ranks.slice(0,3).reduce(function(total,rank){return total+rank},0);
    delete album.trackRanks;
    return album;
  });
}
function formatPopularity(value){
  if(!value)return"";
  try{return new Intl.NumberFormat("en",{notation:"compact",maximumFractionDigits:1}).format(value)}
  catch(e){return String(value)}
}
function matchScore(m,words){
  var q=norm(words.join(" ")),title=norm(m.title),artist=norm(m.artist),score=0;
  if(artist===q)score+=10000;
  else if(q&&artist.indexOf(q)>=0)score+=6000;
  if(title===q)score+=3000;
  else if(q&&title.indexOf(q)>=0)score+=1800;
  words.forEach(function(w){var n=norm(w);if(n&&title.indexOf(n)>=0)score+=45;if(n&&artist.indexOf(n)>=0)score+=60});
  return score;
}
async function searchResults(words){
  var settled=await Promise.allSettled([dzArtistAlbums(words),dzSearch(words),mbSearch(words)]),all=[],available=false;
  settled.forEach(function(result){if(result.status==="fulfilled"){all=all.concat(result.value);available=true}});
  if(!available)throw new Error("Search providers are unavailable");
  var dedup={};
  all.forEach(function(album){
    var key=norm(album.artist)+"|"+norm(album.title);
    var current=dedup[key];
    if(!current){dedup[key]=album;return}
    current.rank=Math.max(current.rank||0,album.rank||0);
    current.popularityRank=Math.max(current.popularityRank||0,album.popularityRank||0);
    current.trackPopularity=Math.max(current.trackPopularity||0,album.trackPopularity||0);
    current.trackSignals=Math.max(current.trackSignals||0,album.trackSignals||0);
    current.artistFans=Math.max(current.artistFans||0,album.artistFans||0);
    current.artistExact=current.artistExact||album.artistExact;
    if(!current.cover&&album.cover)current.cover=album.cover;
    if(!current.year&&album.year)current.year=album.year;
  });
  return Object.keys(dedup).map(function(key){return dedup[key]}).sort(function(a,b){
    if(!!a.artistExact!==!!b.artistExact)return a.artistExact?-1:1;
    if(a.artistExact&&b.artistExact){
      var trackPopularity=(b.trackPopularity||0)-(a.trackPopularity||0);
      if(trackPopularity)return trackPopularity;
      var discographyRank=(b.rank||0)-(a.rank||0);
      if(discographyRank)return discographyRank;
    }
    var relevance=matchScore(b,words)-matchScore(a,words);
    if(relevance)return relevance;
    var popularity=(b.popularityRank||b.rank||0)-(a.popularityRank||a.rank||0);
    if(popularity)return popularity;
    return(b.year||"").localeCompare(a.year||"");
  }).slice(0,18);
}
async function search(v,box,pick){
  box=box||$("#res");if(!box)return;
  pick=pick||function(id){location.hash="#a="+id};
  var words=v.trim().split(/\s+/).map(function(w){return w.replace(/[^\p{L}\p{N}]/gu,"")}).filter(Boolean);
  if(!words.length){box.innerHTML="";return}
  var me=++seq,list=[],why="";box.innerHTML='<div class="msg">Searching…</div>';
  try{list=await searchResults(words)}catch(e){why=e.message}
  if(me!==seq)return;
  if(!list.length){box.innerHTML=why?'<div class="msg">Search failed ('+esc(why)+'). Please try again.</div>':'<div class="msg">No results found.</div>';return}
  var P="c"+(box.id||"x")+"_";
  box.innerHTML=list.map(function(m){
    found[m.id]=m;
    var meta=esc(m.artist)+(m.year?" · "+esc(m.year):"");
    var popularity=m.popularityRank?'<div style="font-size:9px;letter-spacing:.45px;color:var(--accent);margin-top:2px">DEEZER RANK '+formatPopularity(m.popularityRank)+(m.artistFans?' · '+formatPopularity(m.artistFans)+' FANS':'')+'</div>':'';
    return'<button class="res" data-id="'+esc(m.id)+'">'+cover(m,P+m.id)+'<div><div class="t">'+esc(m.title)+'</div><div class="a">'+meta+'</div>'+popularity+'</div></button>'}).join("");
  box.querySelectorAll(".res").forEach(function(b){
    b.onclick=function(){pick(b.dataset.id)};
    var m=found[b.dataset.id];if(m.cover||!isMb(m.id))return;
    dzFind(m.title,m.artist).then(function(d){setCover(P+m.id,d?(d.cover_medium||d.cover_big):caa(m.id))},function(){setCover(P+m.id,caa(m.id))});
  });
}

var alb={};
async function loadAlbum(id){
  if(store.mine[id])return store.mine[id];
  if(alb[id])return alb[id];
  var a;
  if(!isMb(id)){
    var dd=await jsonp(DZ+"album/"+id);if(!dd||dd.error)throw new Error("deezer");
    a={id:id,title:dd.title,artist:(dd.artist&&dd.artist.name)||"",year:(dd.release_date||"").slice(0,4),cover:dd.cover_big||dd.cover_medium||"",tracks:await dzTracks(id)};
    if(!a.tracks.length)throw new Error("no tracks available");
  }else{
    var m=found[id];
    if(!m){var rg=await j(MB+"release-group/"+id+"?fmt=json&inc=artist-credits");m={id:id,title:rg.title,artist:artistOf(rg),year:(rg["first-release-date"]||"").slice(0,4)}}
    a={id:id,title:m.title,artist:m.artist,year:m.year,cover:"",tracks:[]};
    try{var d=await dzFind(m.title,m.artist);if(d){a.cover=d.cover_big||d.cover_medium||"";a.tracks=await dzTracks(d.id)}}catch(e){}
    if(!a.tracks.length)a.tracks=await mbTracks(id);
    if(!a.tracks.length)throw new Error("no tracks available");
  }
  alb[id]=a;return a}

}
function roles(a){
  var v=a.tracks.filter(function(t){return t.r!=null}).map(function(t){return t.r});
  if(v.length<2)return{};
  var hi=Math.max.apply(null,v),lo=Math.min.apply(null,v);
  return hi>lo?{hi:hi,lo:lo}:{}}
function trk(a,i,R,sym){
  var t=a.tracks[i],cls="",tag="";
  if(t.r!=null){
    if(t.r===R.hi){cls=" best";tag=sym?"▲":"BEST"}
    else if(t.r===R.lo){cls=" worst";tag=sym?"▼":"WORST"}
    else cls=" rated"}
  var noteMark=t.note?'<span class="note-indicator" title="'+esc(t.note)+'">NOTE</span>':"";
  return'<button class="tr'+cls+'" data-i="'+i+'"'+(t.r==null?"":' style="--w:'+(t.r*10)+'%"')+'><span class="n">'+(i+1)+'</span><span class="nm">'+esc(t.name)+'</span>'+noteMark+(tag?'<span class="tag">'+tag+'</span>':'')+'<span class="pill'+(t.r==null?" none":"")+'">'+(t.r==null?"–":t.r.toFixed(1))+'</span></button>'}
function ring(m){
  var c=2*Math.PI*36,color=m==null?"#888":col(m);
  return'<div class="ring"><svg viewBox="0 0 84 84" style="filter:drop-shadow(0 0 8px '+color+'aa)"><circle cx="42" cy="42" r="36" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="42" cy="42" r="36" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(c*(m==null?0:m/10))+' '+c+'" transform="rotate(-90 42 42)"/></svg><b style="color:'+color+'">'+(m==null?"—":m.toFixed(1))+'<small>/10</small></b></div>'}

var vtok=0;
function versus(s){
  var tok=vtok,p=s.split(","),ids=[(p[0]||"").trim(),(p[1]||"").trim()],win=-1,err=[false,false];
  var al=ids.map(function(id){return id?(store.mine[id]||alb[id]||null):null});
  cur=null;app.className="wrap wide";
  function setIds(n){location.hash="#v="+n.join(",")}
  function slot(k){
    var a=al[k],name=k?"B":"A";
    if(!ids[k])return'<div class="slot"><div class="vh"><div class="vname">ALBUM '+name+'</div><input id="vq'+k+'" type="search" placeholder="Search for an album…" autocomplete="off"><div id="vr'+k+'" class="vres"></div></div></div>';
    if(err[k])return'<div class="slot"><div class="vh"><div class="msg">Could not load album '+name+'.</div><button class="btn ghost" data-ch="'+k+'">Choose another</button></div></div>';
    if(!a)return'<div class="slot"><div class="vh"><div class="msg">Loading…</div></div></div>';
    var m=avg(a),n=a.tracks.filter(function(t){return t.r!=null}).length,R=roles(a);
    return'<div class="slot"><div class="vh'+(win===k?" win":"")+'">'+(win===k?'<span class="crown">WINNER</span>':'')+cover(a)+'<h2>'+esc(a.title)+'</h2><div class="a">'+esc(a.artist)+(a.year?" · "+esc(a.year):"")+'</div>'+ring(m)+'<div class="cnt">'+n+" / "+a.tracks.length+' tracks rated</div><button class="btn" data-all="'+k+'">'+(n?"Continue rating":"Rate tracks")+'</button><button class="btn ghost" data-ch="'+k+'">Change album</button></div><div class="tracks">'+a.tracks.map(function(t,i){return trk(a,i,R,true)}).join("")+'</div></div>'}
  function draw(){
    if(tok!==vtok)return;
    var am=al.map(function(a){return a?avg(a):null}),vd;
    win=(am[0]!=null&&am[1]!=null&&Math.abs(am[0]-am[1])>0.004)?(am[0]>am[1]?0:1):-1;
    if(win>=0)vd=esc(al[win].title)+" wins · "+am[win].toFixed(1)+" vs "+am[1-win].toFixed(1);
    else if(am[0]!=null&&am[1]!=null)vd="Tie · "+am[0].toFixed(1)+" each";
    else vd='<span style="color:var(--mute);font-weight:500;font-size:14px">Choose two albums and rate their tracks to see the winner</span>';
    app.innerHTML=shell('<button class="btn ghost" id="bk" style="margin-bottom:12px">← Back</button><div class="verdict">'+vd+'</div><div class="vs">'+slot(0)+slot(1)+'</div>',"versus");bindMenu();
    $("#bk").onclick=function(){location.hash=""};
    app.querySelectorAll("[data-ch]").forEach(function(b){b.onclick=function(){var n=ids.slice();n[+b.dataset.ch]="";setIds(n)}});
    app.querySelectorAll("[data-all]").forEach(function(b){b.onclick=function(){
      var a=al[+b.dataset.all],i=a.tracks.findIndex(function(t){return t.r==null});rate(a,i<0?0:i,draw)}});
    var sl=app.querySelectorAll(".slot");
    [0,1].forEach(function(k){
      if(al[k])sl[k].querySelectorAll(".tr").forEach(function(b){b.onclick=function(){rate(al[k],+b.dataset.i,draw)}});
      var q=$("#vq"+k);if(!q)return;
      q.oninput=function(){clearTimeout(timer);var v=this.value;timer=setTimeout(function(){
        search(v,$("#vr"+k),function(id){
          if(id===ids[1-k]){toast("Choose a different album");return}
          var n=ids.slice();n[k]=id;setIds(n)})},650)}})
  }
  ids.forEach(function(id,k){
    if(!id||al[k])return;
    loadAlbum(id).then(function(a){al[k]=a;draw()},function(){err[k]=true;draw()})});
  draw();
}
function route(){
  var h=location.hash;vtok++;app.className="wrap";
  try{
    if(h.indexOf("#s=")===0)shared(dec(h.slice(3)));
    else if(h.indexOf("#a=")===0)openAlbum(h.slice(3));
    else if(h.indexOf("#v=")===0)versus(h.slice(3));
    else if(h==="#ratings")home(true);
    else home();
  }catch(e){home()}
}
$("#theme").onclick=function(){
  var t=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=t;
  try{localStorage.setItem("theme",t)}catch(e){}};
addEventListener("hashchange",route);
route();
</script>
</body>
</html>
